# NOC Horizon — sobe tudo com:  docker compose up -d --build
# Depois abra http://localhost:8080
#
# Por padrão roda em MODO DEMO (dados simulados, sem Zabbix).
# Para usar um Zabbix real, copie .env.example para .env e ajuste.
name: noc-horizon

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  api:
    <<: *hardening
    build: ./backend
    environment:
      NOC_MODE: ${NOC_MODE:-demo}
      ZABBIX_URL: ${ZABBIX_URL:-}
      ZABBIX_API_TOKEN: ${ZABBIX_API_TOKEN:-}
      NOC_STALE_AFTER_SECONDS: ${NOC_STALE_AFTER_SECONDS:-600}
      NOC_GROUP_BY: ${NOC_GROUP_BY:-hostgroup}
      NOC_HOSTGROUP_PREFIX: ${NOC_HOSTGROUP_PREFIX:-}
      NOC_HOST_TAG: ${NOC_HOST_TAG:-}
      NOC_SLO_TARGET: ${NOC_SLO_TARGET:-99.5}
      NOC_SLO_MIN_SEVERITY: ${NOC_SLO_MIN_SEVERITY:-4}

  web:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    ports:
      - "${NOC_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
